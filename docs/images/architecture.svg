<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="790" viewBox="0 0 1010 790" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>HUMI architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>
      .card { fill: #161b22; stroke-width: 2; }
      .title { fill: #e6edf3; font-size: 18px; font-weight: 700; }
      .sub { fill: #8b949e; font-size: 13px; }
      .body { fill: #c9d1d9; font-size: 14px; }
      .small { fill: #c9d1d9; font-size: 13px; }
      .head { fill: #e6edf3; font-size: 14px; font-weight: 600; }
      .label { fill: #8b949e; font-size: 12px; }
      .flow { stroke: #8b949e; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1010" height="790" rx="16" fill="#0d1117"/>
  <text x="24" y="44" class="title" font-size="22">HUMI architecture</text>
  <text x="24" y="68" class="sub" font-size="14">Discord → relay → three n8n workflows → AI and data services. Arrows show data flow.</text>

  <!-- Discord -->
  <rect x="20" y="100" width="170" height="250" rx="12" class="card" stroke="#5865F2"/>
  <text x="36" y="130" class="title">Discord</text>
  <text x="36" y="160" class="head">Customers</text>
  <text x="36" y="182" class="body">#tanya-humi</text>
  <text x="36" y="202" class="body">DMs, @mentions</text>
  <text x="36" y="234" class="head">Admins</text>
  <text x="36" y="256" class="body">#admin-hmns</text>
  <text x="36" y="288" class="head">Announcements</text>
  <text x="36" y="310" class="body">#promo-customer</text>

  <!-- Relay -->
  <rect x="215" y="120" width="170" height="190" rx="12" class="card" stroke="#3fb950"/>
  <text x="231" y="150" class="title">Relay bot</text>
  <text x="231" y="170" class="sub">Node.js · discord.js</text>
  <text x="231" y="200" class="small">channel routing</text>
  <text x="231" y="222" class="small">typing indicator</text>
  <text x="231" y="244" class="small">6 msgs/min per user</text>
  <text x="231" y="266" class="small">welcome message</text>
  <text x="231" y="292" class="small">→ one n8n webhook</text>

  <!-- n8n frame -->
  <rect x="405" y="88" width="370" height="672" rx="14" fill="none" stroke="#EA4B71" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="421" y="112" fill="#EA4B71" font-size="15" font-weight="700">n8n</text>

  <!-- Customer Agent -->
  <rect x="420" y="124" width="340" height="250" rx="12" class="card" stroke="#EA4B71"/>
  <text x="436" y="154" class="title">Customer Agent</text>
  <text x="436" y="182" class="body">IF admin in #admin-hmns → Admin Console</text>
  <text x="436" y="208" class="body">AI Agent: Groq gpt-oss-120b</text>
  <text x="436" y="230" class="body">fallback gpt-oss-20b · 3 retries</text>
  <text x="436" y="256" class="body">tools: search perfumes / home products</text>
  <text x="436" y="278" class="body">memory: last 4 messages per user</text>
  <text x="436" y="304" class="body">first-chat greeting · light Gen Z tone</text>
  <text x="436" y="330" class="body">escalation → #admin-hmns</text>
  <text x="436" y="352" class="body">AI failure → polite reply + admin alert</text>

  <!-- Admin Console -->
  <rect x="420" y="410" width="340" height="130" rx="12" class="card" stroke="#EA4B71"/>
  <text x="436" y="440" class="title">Admin Console</text>
  <text x="574" y="440" class="sub">(sub-workflow)</text>
  <text x="436" y="468" class="body">!stock  !harga → Postgres + Sheet</text>
  <text x="436" y="490" class="body">!broadcast → #promo-customer</text>
  <text x="436" y="512" class="body">!status  !log  !help</text>

  <!-- Knowledge Feeder -->
  <rect x="420" y="580" width="340" height="160" rx="12" class="card" stroke="#EA4B71"/>
  <text x="436" y="610" class="title">Knowledge Feeder</text>
  <text x="600" y="610" class="sub">(catalog sync)</text>
  <text x="436" y="638" class="body">every 5 min + after !stock / !harga</text>
  <text x="436" y="660" class="body">unchanged sheet → stop, no AI calls</text>
  <text x="436" y="682" class="body">changed → embed and write new version,</text>
  <text x="436" y="704" class="body">then delete older vectors (no gaps)</text>
  <text x="436" y="726" class="body">report → #admin-hmns</text>

  <!-- Data and AI services -->
  <rect x="800" y="124" width="170" height="86" rx="12" class="card" stroke="#F55036"/>
  <text x="816" y="154" class="title">Groq API</text>
  <text x="816" y="178" class="body">gpt-oss-120b</text>
  <text x="816" y="198" class="body">+ 20b fallback</text>

  <rect x="800" y="236" width="170" height="86" rx="12" class="card" stroke="#DC244C"/>
  <text x="816" y="266" class="title">Qdrant</text>
  <text x="816" y="290" class="body">hmns_parfum</text>
  <text x="816" y="310" class="body">hmns_home</text>

  <rect x="800" y="350" width="170" height="86" rx="12" class="card" stroke="#4f8cc9"/>
  <text x="816" y="380" class="title">PostgreSQL</text>
  <text x="816" y="404" class="body">humi_chat_memory</text>
  <text x="816" y="424" class="body">products</text>

  <rect x="800" y="470" width="170" height="86" rx="12" class="card" stroke="#34a853"/>
  <text x="816" y="500" class="title">Google Sheet</text>
  <text x="816" y="524" class="body">product catalog,</text>
  <text x="816" y="544" class="body">source of truth</text>

  <rect x="800" y="600" width="170" height="86" rx="12" class="card" stroke="#4285F4"/>
  <text x="816" y="630" class="title">Gemini API</text>
  <text x="816" y="654" class="body">gemini-</text>
  <text x="816" y="674" class="body">embedding-001</text>

  <!-- Flows -->
  <path d="M190 215 H213" class="flow"/>
  <path d="M385 215 H418" class="flow"/>
  <path d="M420 336 H192" class="flow"/>
  <text x="298" y="328" class="label" text-anchor="middle">replies &amp; alerts</text>

  <path d="M590 374 V408" class="flow"/>
  <text x="600" y="396" class="label">admin commands</text>
  <path d="M590 540 V578" class="flow"/>
  <text x="600" y="563" class="label">run sync now</text>

  <path d="M760 167 H798" class="flow"/>
  <path d="M760 279 H798" class="flow"/>
  <path d="M760 362 H798" class="flow"/>
  <path d="M760 425 H798" class="flow"/>
  <path d="M760 500 H798" class="flow"/>
  <path d="M800 540 H786 V620 H762" class="flow"/>
  <path d="M760 650 H798" class="flow"/>

  <path d="M760 702 H990 V279 H972" class="flow"/>
  <path d="M760 722 H1000 V400 H972" class="flow"/>
  <text x="880" y="716" class="label" text-anchor="middle">new vectors + products rows</text>

  <path d="M420 728 H105 V352" class="flow"/>
  <text x="262" y="720" class="label" text-anchor="middle">sync reports</text>

  <text x="24" y="776" class="label">Relay, n8n, Qdrant and PostgreSQL run in Docker Compose. Discord, Groq, Gemini and Google Sheets are external services.</text>
</svg>
